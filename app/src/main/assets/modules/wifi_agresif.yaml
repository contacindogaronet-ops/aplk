name: "Optimasi Wi-Fi Agresif (Non-Root)"
description: "Mematikan throttling, power save, dan background scanning"
commands:
  - "settings put global wifi_scan_throttle_enabled 0"
  - "settings put global wifi_suspend_optimizations_enabled 0"
  - "settings put global wifi_power_save 0"
  - "settings put global wifi_sleep_policy 2"
  - "settings put global wifi_scan_always_enabled 0"
  - "settings put global ble_scan_always_enabled 0"
  - "settings put global mobile_data_always_on 0"
  - "settings put global captive_portal_mode 0"
  - "settings put global captive_portal_detection_enabled 0"
  - "settings put global wifi_watchdog_on 0"
  - "settings put global network_scoring_ui_enabled 0"
  - "settings put global wifi_enhanced_auto_join 1"
  - "settings put global wifi_verbose_logging 0"
