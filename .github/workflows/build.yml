name: Android CI Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Ensure Keystore Exists
        run: |
          if [ ! -f app/release.keystore ]; then
            echo "release.keystore not found, generating fallback key..."
            keytool -genkeypair -v \
              -keystore app/release.keystore \
              -alias mykeyalias \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass mysecretpass \
              -keypass mysecretpass \
              -dname "CN=Developer, OU=Dev, O=App, L=City, ST=State, C=ID"
          fi

      - name: Restore Gradle Wrapper Binary
        run: |
          mkdir -p gradle/wrapper
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "gradle-wrapper.jar not found, restoring from official release..."
            curl -sSL "https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradle/wrapper/gradle-wrapper.jar" -o gradle/wrapper/gradle-wrapper.jar
          fi

      - name: Setup Gradle & Enable Caching
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-disabled: false
          generate-job-summary: true

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --build-cache

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: app/build/outputs/apk/debug/app-debug.apk
